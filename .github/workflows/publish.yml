name: Publish

# Publishes to npm with provenance through trusted publishing. Never runs
# from a pull request: only a published GitHub release or a maintainer's
# manual dispatch, once the npm-publish environment and the package's trusted
# publisher are configured.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run release:validate

      - run: npm publish --provenance --access public
