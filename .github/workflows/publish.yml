name: Publish

# Publishes to npm using npm provenance / trusted publishing. This workflow is
# intentionally never triggered by pull_request events — only by a published
# GitHub Release or an explicit manual dispatch by a maintainer — so that
# publication only happens once human release configuration (npm trusted
# publisher setup, version bump review, etc.) is complete.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      - run: npm run lint

      - run: npm run format

      - name: Publish with provenance
        run: npm publish --provenance --access public
