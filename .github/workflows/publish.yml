name: Publish

# Publishes to npm with provenance. Never runs from a pull request: only a
# published GitHub release or a maintainer's manual dispatch.
#
# Authentication has two phases. npm cannot configure a trusted publisher for
# a package that does not exist yet (npm/cli#8544), so the first publish
# authenticates with a short-lived granular token in the NPM_TOKEN secret.
# Once the package exists and its trusted publisher is configured, delete that
# secret: npm then authenticates over OIDC and no long-lived credential
# remains. Provenance comes from `id-token: write` either way.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - run: npm install --global npm@^11.5.1

      - run: npm ci

      - run: npm run release:validate

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Authenticating with the NPM_TOKEN secret (bootstrap publish)."
            # Single-quoted: npm expands $NPM_TOKEN when it reads .npmrc,
            # so the token itself never reaches the command line.
            npm config set //registry.npmjs.org/:_authToken '${NPM_TOKEN}'
          else
            echo "No NPM_TOKEN secret; authenticating over OIDC (trusted publishing)."
          fi
          npm publish --provenance --access public
